name: Build binary
permissions: read-all

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    name: Build binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_version: [Debug, Release]
    timeout-minutes: 30

    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4

      # CMake 4.x drops compatibility with cmake_minimum_required < 3.5
      - name: Setup CMake 3.x
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.x'

      - name: Initialize and update submodules
        run: git submodule update --init --recursive

      - name: Prepare build directory
        run: mkdir -p teeio-validator/build

      - name: Build
        run: |
              cd teeio-validator/build/
              cmake -DARCH=x64 -DTOOLCHAIN=GCC -DTARGET=${{matrix.build_version}} -DCRYPTO=mbedtls ..
              make -j
  