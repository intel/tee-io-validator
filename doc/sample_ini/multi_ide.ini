[Main]
debug_level     = info
;libspdm_log    = 1      ; enable libspdm log output
;doe_log        = 1      ; enable DOE log

[Ports]
rootport_1      = 02.0   ; dev/func of rootport 1
endpoint_1      = 00.0   ; dev/func of endpoint 1

[Topology_1]
type            = selective_and_link_ide  ; must be selective_and_link_ide for multi-ide
connection      = direct                  ; Directly connected EP
bus             = 0xd9
path1           = rootport_1,endpoint_1
streams         = link_ide:1,selective_ide:2,cxl_cm_ide:0  ; set up and torn down in this order
; 2 link_ide, 2 selective_ide and 1 cxl_cm_ide stream. Streams of one type need different tc.
; addr is a 1MB aligned range inside the device memory window.
;streams        = link_ide:1:tc=0,link_ide:3:tc=1,selective_ide:2:tc=0,selective_ide:4:tc=1:addr=0x80000000-0x801fffff,cxl_cm_ide:0

[Configuration_1]
category        = multi-ide
cxl_ide_mode    = containment   ; used by the cxl_cm_ide stream

[TestSuite_1]
category        = multi-ide
configuration   = 1
topology        = 1
MultiStream     = 1,2           ; refer to doc/multi_ide_test/MultiIdeTestCase/1.MultiStream.md
